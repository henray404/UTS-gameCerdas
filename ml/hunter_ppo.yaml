# PPO for The Hunter (plans/rl-training-lab.md, Fase 4). The Hunter decides only ~3 times per mission, and trainer
# steps count decisions, so 100k steps is roughly 5-6 hours with 10 envs. Gamma matches Q-learning (0.95).
# Run: mlagents-learn ml/hunter_ppo.yaml --run-id hunter_ppo_v1 --env <build>/HollowHouse.x86_64 --num-envs 10
#      --no-graphics --time-scale 4 --timeout-wait 600 --env-args -hunter-ppo-train
behaviors:
  HunterGuard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.95
        strength: 1.0
    time_horizon: 64
    max_steps: 100000
    summary_freq: 2000
    checkpoint_interval: 10000
    keep_checkpoints: 10
environment_parameters:
  level:
    curriculum:
      - name: L1
        completion_criteria: {measure: reward, behavior: HunterGuard, threshold: 0.0, min_lesson_length: 200}
        value: 1
      - name: L3
        completion_criteria: {measure: reward, behavior: HunterGuard, threshold: 0.0, min_lesson_length: 200}
        value: 3
      - name: L6
        value: 6
