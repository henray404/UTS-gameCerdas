# PPO for The Hunter on build v2 (-hunter-solo, -thiefbot-skill, -hunter-seed random; see ml/rl-expansion.md).
# Same network, rewards and gamma as ml/hunter_ppo.yaml. Differences, from the lab's v1 run (Nov 2026):
#  - v1 left lesson L1 after ~6k steps (threshold 0.0, 200 episodes) and spent 93% of training on L6, where the bot
#    could not escape anyway. Here a lesson needs mean reward > 0.3 over 500 episodes, and L5 sits between L3 and L6.
#  - 200k steps: v1 ran ~25 steps/s with 5 envs, so this is ~2-3 hours on the shared lab.
# Run with: --env-args -job-worker-count 0 -hunter-ppo-train -hunter-solo -hunter-seed random -thiefbot-skill <x>
behaviors:
  HunterGuard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.95
        strength: 1.0
    time_horizon: 64
    max_steps: 200000
    summary_freq: 2000
    checkpoint_interval: 20000
    keep_checkpoints: 10
environment_parameters:
  level:
    curriculum:
      - name: L1
        completion_criteria: {measure: reward, behavior: HunterGuard, threshold: 0.3, min_lesson_length: 500}
        value: 1
      - name: L3
        completion_criteria: {measure: reward, behavior: HunterGuard, threshold: 0.3, min_lesson_length: 500}
        value: 3
      - name: L5
        completion_criteria: {measure: reward, behavior: HunterGuard, threshold: 0.3, min_lesson_length: 500}
        value: 5
      - name: L6
        value: 6
